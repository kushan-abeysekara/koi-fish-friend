server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Use custom log format defined in http block (log-format.conf)
    access_log /var/log/nginx/access.log detailed;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # ─── Supabase pg/query reverse proxy (fixes CORS in production) ───
    # Frontend POSTs to /supabase-pg → nginx proxies to Supabase pg/query
    # Same as Vite dev proxy but for production
    location /supabase-pg {
        # DNS resolver for Docker containers (alpine) + Google DNS fallback
        resolver 127.0.0.11 8.8.8.8 valid=30s;
        set $supabase_upstream https://superbase.koifishfriend.online/pg/query;
        proxy_pass $supabase_upstream;
        proxy_set_header Host superbase.koifishfriend.online;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Handle React Router - send all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
